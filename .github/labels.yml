# Label set for https://github.com/gusthanks/keroo
#
# This is a plain data file. Nothing in the repository reads it automatically, and
# there is no workflow for it. To apply it, a maintainer can either:
#
#   1. Create the labels one by one with the GitHub CLI (--force updates a label that
#      already exists), for example:
#
#        gh label create "area:budgeting" --color "0e8a16" \
#          --description "Envelope budgeting and categories" --force
#
#      repeating it for every entry below, or by wrapping the call in a small script
#      that reads this file; or
#
#   2. Point a label-sync GitHub Action at this file from a workflow of your own.
#
# Colors are six-digit hex values without "#". They are quoted on purpose, so YAML never
# reads a value such as "5319e7" as a number. GitHub limits descriptions to 100 characters.

- name: "bug"
  color: "d73a4a"
  description: "Something is not working as intended"

- name: "enhancement"
  color: "a2eeef"
  description: "New feature or improvement"

- name: "documentation"
  color: "0075ca"
  description: "Improvements or additions to the docs"

- name: "good first issue"
  color: "7057ff"
  description: "Good for newcomers"

- name: "help wanted"
  color: "008672"
  description: "Extra attention or a contributor is welcome"

- name: "i18n"
  color: "1d76db"
  description: "Translations, locale handling and language support"

- name: "pt-BR"
  color: "2da44e"
  description: "Brazilian Portuguese: translation or locale-specific behavior"

- name: "en-US"
  color: "3b5998"
  description: "American English: translation or locale-specific behavior"

- name: "area:budgeting"
